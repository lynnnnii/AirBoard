name: AirBoard Python tests

on:
  push:
    branches: [fix/thumb-swipe-ink-undo-redo]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.txt
      - name: Run full unit-test suite
        env:
          AIRBOARD_USER_SETTINGS: /tmp/airboard-ci-user-settings.json
        run: python -m unittest discover -s tests -v
